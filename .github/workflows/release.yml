# GitHub Actions workflow to release a Go project using GoReleaser.
# Releases are published from tags matching "v*.*.*".
name: "Release"
on:
  push:
    tags: [ "v*.*.*" ]

jobs:
  release:
    name: "Release"
    uses: HyperaDev/actions/.github/workflows/go-release.yml@beddc3665d0e5acb585777857b14115017633dd0 # main
    permissions:
      contents: write # Create releases
      packages: write # Write packages
    with:
      docker_enabled: true
    secrets:
      DOCKERHUB_USERNAME: "${{ secrets.DOCKERHUB_USERNAME }}"
      DOCKERHUB_TOKEN: "${{ secrets.DOCKERHUB_TOKEN }}"
      GITHUB_RELEASE_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
