# GitHub Actions workflow to build and test a Go project.
name: "Go"
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  merge_group:

jobs:
  build:
    name: "Build"
    uses: HyperaDev/actions/.github/workflows/go-build.yml@beddc3665d0e5acb585777857b14115017633dd0 # main
    with:
      go_version: "stable"
      codecov_enabled: true
      vulncheck_enabled: true
